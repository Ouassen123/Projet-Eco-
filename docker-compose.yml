version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: projet-eco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: projet_eco
    ports:
      - "5432:5432"
    volumes:
      - projet_eco_postgres_data:/var/lib/postgresql/data

volumes:
  projet_eco_postgres_data:
